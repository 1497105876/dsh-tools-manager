# @gw/dsh-tools-manager —— 挂载行
#
# ⚠ 必须挂「裸包名」且包要真装进 profile 的 node_modules（link: 也算），
#   不能用 file:// —— 那样浏览器半会连坐搞挂整个前端 bundle。
#
# 这是 Host 平面插件（不是某个模式内部的行），因为它要收全部 agent 的 created 事件。
#
# 默认不带任何规则：装上之后什么都不禁，工具全放行。
# 哪个模式要禁什么，去「设置 → 工具管理」里点，保存即生效。
# 规则落在 ~/.dsh/plugin-data/tools-manager/rules.json，不写回这个文件。
#
# 这里是「按 preset 的禁用名单」，不是白名单 —— 写完只影响点名的那些工具，
# 其余一概不碰。
- insert:
    - id: tools-manager
      name: '@gw/dsh-tools-manager'
      config: {}
      # ↓ 只在想用配置文件预置规则时才填，正常情况下留空。
      #   rules.<presetId>.deny   工具名数组（standard / ptc / minimal / cordis / qq / 以后新增的任意 id）
      #   rules['*'].deny         兜底：没有专属规则的模式都用它
      #   defaultRule.deny        连 '*' 都没配时用
      #
      # rules:
      #   qq:
      #     deny: [bash, subagent_fork]
      #   '*':
      #     deny: []
